name: Auto Generate Content

on:
  # 每天UTC时间00:00, 08:00, 16:00自动生成内容
  schedule:
    - cron: '0 0 * * *'   # 每天00:00
    - cron: '0 8 * * *'   # 每天08:00
    - cron: '0 16 * * *'  # 每天16:00
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      topic:
        description: '文章主题'
        required: false
        default: 'technology'
      count:
        description: '生成文章数量'
        required: false
        default: '1'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 markdown
      
      - name: Generate new article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic || 'technology' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          python .github/scripts/generate_article.py --topic "$TOPIC" --count $COUNT
      
      - name: Commit and push new content
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _posts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generated: New article on ${{ github.event.inputs.topic || 'technology' }}"
          git push