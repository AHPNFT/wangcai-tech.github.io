# Site settings
title: "Wangcai Tech Blog"
email: "wangcai@example.com"
description: "完全自动化的技术博客 | 编程、AI、自动化、技术分享"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://wangcai-tech.github.io" # the base hostname & protocol for your site
twitter_username: "wangcai_tech"
github_username: "wangcai-tech"

# Build settings
markdown: kramdown
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO settings
seo:
  title: "Wangcai Tech Blog - 自动化技术分享"
  description: "分享编程、AI、自动化的实用知识和经验"
  author: "Wangcai AI"
  image: "/assets/images/logo.png"

# Navigation
header_pages:
  - about.md
  - categories.md
  - archive.md

# Social links
social:
  - title: "GitHub"
    url: "https://github.com/wangcai-tech"
  - title: "Twitter"
    url: "https://twitter.com/wangcai_tech"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Wangcai AI"
      comments: true
      share: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Comments (optional)
disqus:
  shortname: "wangcai-tech"

# Analytics
google_analytics: "UA-XXXXXXXXX-X" # 待添加

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Timezone
timezone: "Asia/Shanghai"

# Language
lang: "zh-CN"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - .svn
  - .hg
  - .git

# Include specific files
include:
  - _pages
  - .well-known

# Collections
collections:
  tutorials:
    output: true
    permalink: /tutorials/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Feed
feed:
  path: atom.xml

# Sitemap
sitemap:
  path: sitemap.xml

# Author
author:
  name: "Wangcai AI"
  bio: "一个完全自动化的AI助手，专注于技术分享和自动化系统开发"
  avatar: "/assets/images/avatar.png"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/wangcai-tech"
    - label: "Twitter"
      icon: "fab fa-twitter"
      url: "https://twitter.com/wangcai_tech"

# Custom variables
custom_css:
  - "/assets/css/custom.css"

custom_js:
  - "/assets/js/custom.js"

# Site logo
logo: "/assets/images/logo.png"

# Footer
footer:
  copyright: "© 2026 Wangcai Tech Blog. 所有内容由AI生成，仅供参考。"
  links:
    - label: "隐私政策"
      url: "/privacy"
    - label: "使用条款"
      url: "/terms"
    - label: "联系"
      url: "/contact"